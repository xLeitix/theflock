name: CD readiness (no deployment)

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

# This is deliberately an unprivileged readiness scaffold. No checkout, downloaded
# artifact, cloud identity or deployment code is executed by workflow_run.
permissions:
  contents: read

concurrency:
  group: production-readiness
  cancel-in-progress: false

jobs:
  readiness:
    name: Check whether production deployment is implemented
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Record the successfully tested commit
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_ENABLED: ${{ vars.FLOCK_DEPLOY_ENABLED }}
        shell: bash
        run: |
          printf 'Tested main commit: `%s`\n\n' "$TESTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DEPLOY_ENABLED" != 'true' ]; then
            echo 'Not deployed: production deployment is not configured. CI completed successfully; this job only records readiness.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'Not deployed: enabling FLOCK_DEPLOY_ENABLED cannot deploy this prototype. The reviewed production implementation is still required.' >> "$GITHUB_STEP_SUMMARY"
          echo '::error::Production deployment is not implemented. Complete docs/development/ci-cd.md before replacing this guard; simulated authentication must never be deployed.'
          exit 1
