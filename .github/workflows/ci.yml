name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    name: Typecheck, real MongoDB, build and browser tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        id: dependencies
        run: npm ci

      - name: Install checksum-pinned native MongoDB
        run: bash scripts/ci-install-mongo.sh

      - name: Install the matching Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Start authenticated local replica set
        run: npm run dev:setup

      - name: Typecheck
        run: npm run typecheck

      - name: Run API and process-ownership tests against real MongoDB
        run: npm test

      - name: Build the frontend
        run: npm run build

      - name: Start and seed the detached local application
        run: npm run dev

      - name: Test mobile, desktop and geolocation workflows
        run: npm run test:e2e

      - name: Stop only services owned by this checkout
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run dev:stop

      - name: Collect only browser screenshots
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/flock-ci-screenshots"
          if [ -d .local/playwright-results ]; then
            find .local/playwright-results -type f -name '*.png' \
              -exec cp --parents -- '{}' "$RUNNER_TEMP/flock-ci-screenshots/" \;
          fi

      - name: Upload browser screenshots only
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots-${{ github.run_id }}
          path: ${{ runner.temp }}/flock-ci-screenshots/**/*.png
          # The allowlist above copies only PNG files; no traces or runtime files.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the tested frontend bundle
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-preview-${{ github.sha }}
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Explain the release boundary
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          This workflow validates the local prototype with Node.js 24, authenticated MongoDB 7.0.31 and Chromium.

          Main pushes call this workflow from Release preview. These checks must pass before the separate image verification and protected-preview deployment jobs. Public production authentication remains unimplemented.

          Runtime credentials, MongoDB files, server logs, Playwright traces and cookies are never uploaded. See `docs/development/ci-cd.md` for the production readiness boundary.
          SUMMARY
